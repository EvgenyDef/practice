<div class="page-container">
  <!-- Верхняя панель (Header) -->
  <header class="header">
    <div class="logo">SURF.RU</div>
    
    <div class="header-right">
      <!-- Профиль пользователя -->
      <div class="user-profile">
        <div class="user-avatar-fallback"></div>
        <span class="username">пользователь</span>
      </div>
      <!-- Кнопка выхода -->
      <button class="logout-btn" title="Выйти">
        <!-- SVG Иконка выхода -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logout-icon">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Основной контент -->
  <main class="main-content">
    
    <!-- Карточка добавления новой записи -->
    <div class="feed-card create-post-card">
      <div class="card-header">
        Добавление новой записи
      </div>
      <div class="card-body">
        <form class="post-form">
          <!-- Текстовое поле -->
          <div class="form-group">
            <label for="postText">Введите текст</label>
            <textarea 
              id="postText" 
              name="postText" 
              class="form-textarea" 
              placeholder="Текст"
            ></textarea>
          </div>

          <!-- Нижняя панель формы (загрузка файла и кнопка отправки) -->
          <div class="form-actions">
            
            <div class="file-upload-group">
              <label>Прикрепить изображение</label>
              <div class="file-upload-wrapper">
                <input type="text" readonly class="form-input file-path-input">
                <label class="btn btn-file">
                  Обзор...
                  <input type="file" class="hidden-file-input">
                </label>
              </div>
            </div>

            <button type="submit" class="btn btn-submit">Добавить</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Место для последующих постов в ленте -->
    
  </main>
</div>
